<!DOCTYPE html>
<html lang="en" data-theme="gold">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) &mdash; JewelDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141009;
            color: #FAF4EA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: rgba(34, 28, 16, 0.95);
            border: 1px solid rgba(245, 206, 107, 0.25);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }
        .error-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #EF4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }
        .error-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #FAF4EA;
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: #D4C5B0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, #ECC86A 0%, #D4AF37 100%);
            color: #141009;
            font-weight: 700;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #F5D77F 0%, #ECC86A 100%);
            color: #141009;
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FAF4EA;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="error-title">Server Error (500)</h1>
        <p class="error-desc">
            An unexpected error occurred while processing your request. Please reload the page or return to your showroom dashboard.
        </p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <button onclick="window.location.reload();" class="btn btn-gold">
                <i class="bi bi-arrow-clockwise"></i> Reload Page
            </button>
            <a href="/" class="btn btn-ghost">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </div>
    </div>
</body>
</html>
