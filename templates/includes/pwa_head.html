{% load static %}
<!-- Progressive Web App (PWA) & Mobile Application Meta Tags -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="{% static 'icons/favicon.ico' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16x16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">

<!-- Mobile Chrome, Edge, Android Theme Colors -->
<meta name="theme-color" content="#1a2232">
<meta name="mobile-web-app-capable" content="yes">

<!-- Apple iOS Safari Web App Configuration -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JewelDesk">
<meta name="application-name" content="JewelDesk">
