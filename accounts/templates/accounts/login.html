{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — JewelDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .login-header {
            background-color: #212529;
            color: #d4a843;
            text-align: center;
            padding: 2rem 1.5rem 1.5rem;
            border-radius: 12px 12px 0 0;
        }
        .login-header i {
            font-size: 2.5rem;
        }
        .login-header h4 {
            margin-top: 0.75rem;
            color: #fff;
            font-weight: 600;
        }
        .login-header p {
            color: #adb5bd;
            font-size: 0.875rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <i class="bi bi-gem"></i>
            <h4>JewelDesk</h4>
            <p>Jewellery Shop Management</p>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
            <div class="alert alert-danger py-2" role="alert">
                <small>Invalid username or password. Please try again.</small>
            </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-medium">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="id_username"
                               class="form-control" placeholder="Enter username"
                               autofocus required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="id_password"
                               class="form-control" placeholder="Enter password"
                               required>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-medium">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
